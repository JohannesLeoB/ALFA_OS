# ALFAcolor app target. Source of the Xcode project.
# Generate: cd ALFAcolor && xcodegen generate  (ALFAcolor.xcodeproj is ignored by git.)
# Visible texts are in App/Localizable.xcstrings. The copyright text is in App/InfoPlist.xcstrings.
name: ALFAcolor

options:
  # App language: German, so that the system menus appear in German too.
  developmentLanguage: de
  deploymentTarget:
    macOS: "26.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    DEVELOPMENT_TEAM: 28Z2KHMANG
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
    MARKETING_VERSION: "1.0.2"
    CURRENT_PROJECT_VERSION: "8"

packages:
  ALFAcolorKit:
    path: ../app

targets:
  ALFAcolor:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes:
          # The starter sources are read by the generator in the tests, not bundled. The package is added below.
          - Resources/Starter/**
      # The starter document, as a folder reference so that its folder structure stays.
      - path: App/Resources/Starter/Bausteine.alfacolor
        type: folder
        buildPhase: resources
      # The example document of the first start, as a folder reference.
      - path: Beispiele/Example.alfacolor
        type: folder
        buildPhase: resources
      # The design contract: the light and the dark token file. The theme reads both at start.
      # The design contract files, as flat resources.
      - path: ../gestaltung/vertrag/tokens.json
        buildPhase: resources
      - path: ../gestaltung/vertrag/tokens.dunkel.json
        buildPhase: resources
    dependencies:
      - package: ALFAcolorKit
        product: ALFAcolorKit
    info:
      path: Config/Info.plist
      properties:
        CFBundleName: ALFAcolor
        CFBundleDisplayName: ALFAcolor
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        LSApplicationCategoryType: public.app-category.graphics-design
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.johannesleoberger.alfacolor
            UTTypeDescription: ALFAcolor-Dokument
            UTTypeConformsTo: [com.apple.package]
            UTTypeTagSpecification:
              public.filename-extension: [alfacolor]
        CFBundleDocumentTypes:
          - CFBundleTypeName: ALFAcolor-Dokument
            CFBundleTypeIconFile: ALFAcolorDocument
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSTypeIsPackage: true
            LSItemContentTypes: [com.johannesleoberger.alfacolor]
    entitlements:
      path: Config/ALFAcolor.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.files.bookmarks.app-scope: true
        com.apple.security.network.client: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.johannesleoberger.alfacolor
        PRODUCT_NAME: ALFAcolor
        GENERATE_INFOPLIST_FILE: NO
        # Xcode capabilities mirror the entitlements file, so that the UI does not show them as off.
        ENABLE_APP_SANDBOX: YES
        ENABLE_USER_SELECTED_FILES: readwrite
        ENABLE_OUTGOING_NETWORK_CONNECTIONS: YES
        # The app icon is the asset set in App/Assets.xcassets. The document icon is App/Resources/ALFAcolorDocument.icns.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  # App-level tests. No test host: the app is never launched, so no window or sound appears. The app sources are
  # compiled into this bundle except the entry point; the layout probe hosts views in a window that is never shown.
  ALFAcolorAppTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: AppTests
      - path: App
        excludes:
          - Resources/Starter/**
          - ALFAcolorApp.swift
    resources:
      - path: ../gestaltung/vertrag/tokens.json
      - path: ../gestaltung/vertrag/tokens.dunkel.json
    dependencies:
      - package: ALFAcolorKit
        product: ALFAcolorKit
    settings:
      base:
        SWIFT_VERSION: "6.0"
        MACOSX_DEPLOYMENT_TARGET: "26.0"
        DEVELOPMENT_TEAM: 28Z2KHMANG
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.johannesleoberger.alfacolor.tests

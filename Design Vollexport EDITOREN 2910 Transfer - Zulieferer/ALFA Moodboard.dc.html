<html>
<head>

<body>
<x-dc>

<sc-if value="{{ ready }}" hint-placeholder-val="{{ true }}">
<dc-import name="ALFA Shell" area="Moodboard" appearance="{{ licht }}" ground="{{ shGrund }}" typeface="{{ shSchrift }}" handle="hairline" window="{{ fenster }}" w="{{ wArr }}" lanes="{{ lanes }}" slow="{{ slow }}" maxed="{{ maxed }}" groups="{{ groups }}" badges="{{ badges }}" dot="{{ shDot }}" sync-state="{{ syncState }}" sync-title="{{ syncTitle }}" me-ini="JB" assist-text="{{ assistText }}" search-path="{{ searchD }}" visible-lanes="{{ laneSet }}" on-choose="{{ onChoose }}" on-mode="{{ onMode }}" on-mem="{{ onMem }}" on-grow="{{ onGrow }}" on-sync="{{ onSync }}" on-root-down="{{ rootDown }}" hint-size="100%,100%">

<div data-slot="0" style="display:contents">
<sc-if value="{{ isList }}" hint-placeholder-val="{{ true }}">
<header data-part="lane-header" style="flex:none;height:44px;display:flex;align-items:center;gap:8px;padding:0 8px 0 16px;box-shadow:inset 0 -1px 0 {{ L.hLine }};transition:box-shadow 160ms;box-sizing:border-box;min-width:0">
<sc-if value="{{ L.searchOpen }}" hint-placeholder-val="{{ false }}"><label data-part="input-field" data-state="focus" style="flex:1;min-width:0;height:28px;display:flex;align-items:center;gap:8px;box-shadow:inset 0 -1px 0 var(--c-ink)"><input ref="{{ searchRef }}" value="{{ L.query }}" onChange="{{ L.onQuery }}" onKeyDown="{{ L.queryKey }}" placeholder="In der Bibliothek suchen" aria-label="Bibliothek durchsuchen" autocomplete="off" spellcheck="false" style="flex:1;min-width:0;border:0;background:none;outline:none;color:inherit;font:inherit;padding:0"></input></label></sc-if>
<sc-if value="{{ L.searchClosed }}" hint-placeholder-val="{{ true }}"><span style="flex:none;font-weight:500;white-space:nowrap">Bibliothek</span><span style="flex:1"></span></sc-if>
<sc-for list="{{ L.tools }}" as="x" hint-placeholder-count="2"><button data-part="{{ x.part }}" data-state="{{ x.state }}" style-active="transform:scale(.96)" title="{{ x.label }}" aria-label="{{ x.label }}" onClick="{{ x.go }}" style="appearance:none;border:0;flex:none;height:28px;min-width:28px;padding:{{ x.pad }};border-radius:999px;display:flex;align-items:center;justify-content:center;gap:8px;font:inherit;background:{{ x.bg }};color:{{ x.fg }};box-shadow:{{ x.ring }};cursor:pointer;white-space:nowrap"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="{{ x.d }}"></path></svg><sc-if value="{{ x.showLabel }}" hint-placeholder-val="{{ false }}"><span>{{ x.text }}</span></sc-if></button></sc-for>
</header>
<div data-part="lane-content" onScroll="{{ L.onScroll }}" style="flex:1;min-height:0;overflow-x:hidden;overflow-y:auto;padding:8px;display:flex;flex-direction:column;scrollbar-width:thin">
<sc-for list="{{ L.sections }}" as="sec" hint-placeholder-count="3">
<div data-part="list-section-header" style="flex:none;height:32px;display:flex;align-items:flex-end;gap:8px;padding:0 8px 8px;box-sizing:border-box;font-size:11.5px;color:var(--c-ink-3)"><span>{{ sec.name }}</span></div>
<sc-if value="{{ sec.isTiles }}" hint-placeholder-val="{{ true }}">
<div style="flex:none;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 8px;padding:0 0 12px">
<sc-for list="{{ sec.tiles }}" as="t" hint-placeholder-count="4">
<button data-part="catalog-tile" draggable="{{ t.draggable }}" onDragStart="{{ t.drag }}" title="{{ t.tip }}" onClick="{{ t.go }}" style="appearance:none;border:0;padding:0;font:inherit;color:inherit;text-align:left;display:flex;flex-direction:column;gap:4px;min-width:0;cursor:pointer;background:transparent" style-active="transform:scale(.98)" data-id="moodboard.catalog-tile.go">
<span style="position:relative;display:block;width:100%;aspect-ratio:{{ t.ar }};border-radius:8px;overflow:hidden;background:{{ t.bg }};box-shadow:inset 0 0 0 1px var(--c-line)">
<sc-if value="{{ t.hasSrc }}" hint-placeholder-val="{{ false }}"><span style="position:absolute;left:0;top:0;width:100%;height:100%;background-image:{{ t.srcCss }};background-size:cover;background-position:center"></span></sc-if>
<sc-if value="{{ t.hasWord }}" hint-placeholder-val="{{ false }}"><span style="position:absolute;left:0;top:0;width:100%;height:100%;display:grid;place-items:center;font-size:{{ t.wfs }};font-weight:500;letter-spacing:-.01em;color:#171717">{{ t.word }}</span></sc-if>
<sc-if value="{{ t.hasBars }}" hint-placeholder-val="{{ false }}"><span style="position:absolute;left:0;top:0;width:100%;height:100%;display:flex"><sc-for list="{{ t.bars }}" as="c" hint-placeholder-count="5"><i style="flex:1;background:{{ c.c }}"></i></sc-for></span></sc-if>
<sc-if value="{{ t.hasRects }}" hint-placeholder-val="{{ false }}"><sc-for list="{{ t.rects }}" as="r" hint-placeholder-count="3"><i style="position:absolute;left:{{ r.l }};top:{{ r.t }};width:{{ r.w }};height:{{ r.h }};background:{{ r.bg }}"></i></sc-for></sc-if>
<sc-if value="{{ t.used }}" hint-placeholder-val="{{ false }}"><span title="Im Dokument" style="position:absolute;right:4px;top:4px;width:8px;height:8px;border-radius:50%;background:#171717;box-shadow:0 0 0 2px #ffffff"></span></sc-if>
</span>
<span style="min-width:0;font-size:11.5px;line-height:16px;color:var(--c-ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ t.n }}</span>
<span style="min-width:0;margin-top:-4px;font-size:11.5px;line-height:16px;color:var(--c-ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums">{{ t.meta }}</span>
</button>
</sc-for>
</div>
</sc-if>
<sc-if value="{{ sec.isRows }}" hint-placeholder-val="{{ false }}">
<div style="flex:none;display:flex;flex-direction:column;padding:0 0 12px">
<sc-for list="{{ sec.rows }}" as="r" hint-placeholder-count="3">
<button data-part="list-row" onClick="{{ r.go }}" title="{{ r.tip }}" style="appearance:none;border:0;font:inherit;color:inherit;flex:none;height:44px;width:100%;display:flex;align-items:center;gap:12px;padding:0 8px;border-radius:12px;cursor:pointer;background:transparent;text-align:left" style-hover="box-shadow:inset 0 0 0 1px var(--c-line-strong)" style-active="transform:scale(.99)" data-id="moodboard.list-row.go">
<span data-part="mark" style="flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;box-shadow:inset 0 0 0 1px var(--c-line-strong);font-family:{{ r.fam }};font-weight:{{ r.fw }};font-size:12px">{{ r.mark }}</span>
<span style="flex:1;min-width:0;display:flex;flex-direction:column"><span style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:{{ r.fam }};font-weight:{{ r.fw }}">{{ r.n }}</span><span style="font-size:11.5px;line-height:16px;color:var(--c-ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ r.sub }}</span></span>
</button>
</sc-for>
</div>
</sc-if>
</sc-for>
<sc-if value="{{ L.empty }}" hint-placeholder-val="{{ false }}"><div data-part="content-state" data-state="noResults" style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;text-align:center;color:var(--c-ink-3);text-wrap:pretty"><span>{{ L.emptyText }}</span><button data-part="text-button" style-active="transform:scale(.96)" onClick="{{ L.clearGo }}" style="appearance:none;border:0;height:28px;padding:0 12px;border-radius:999px;font:inherit;font-size:11.5px;font-weight:500;background:transparent;color:var(--c-ink);box-shadow:inset 0 0 0 1px var(--c-line-strong);cursor:pointer" data-id="moodboard.text-button.clear-go">Filter zurücksetzen</button></div></sc-if>
</div>
<div data-part="lane-footer" style="flex:none;padding:8px"><input ref="{{ fileRef }}" type="file" accept="image/*" multiple="multiple" onChange="{{ L.onFiles }}" style="display:none"></input><button data-part="compose-button" style-active="transform:scale(.98)" title="Bilder aus Dateien hinzufügen" onClick="{{ L.fileGo }}" style="appearance:none;border:0;width:100%;height:36px;padding:0 12px 0 8px;box-sizing:border-box;border-radius:12px;display:flex;align-items:center;gap:20px;font:inherit;background:var(--c-inv);color:var(--c-on-inv);cursor:pointer;transition:opacity 160ms" style-hover="opacity:.88" data-id="moodboard.compose-button.file-go"><span data-part="mark" style="flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;box-shadow:inset 0 0 0 1px color-mix(in srgb, currentColor 30%, transparent)"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="{{ plusD }}"></path></svg></span><span style="flex:1;min-width:0;text-align:left">Bilder hinzufügen</span></button></div>
</sc-if>
</div>

<div data-slot="1" style="display:contents">
<sc-if value="{{ isMain }}" hint-placeholder-val="{{ true }}">
<header data-part="lane-header" style="flex:none;height:44px;display:flex;align-items:center;gap:8px;padding:0 8px 0 16px;box-shadow:inset 0 -1px 0 var(--c-line);box-sizing:border-box;min-width:0">
<span style="flex:none;font-weight:500;white-space:nowrap">{{ B.name }}</span>
<span data-part="counter" style="flex:none;min-width:20px;height:20px;box-sizing:border-box;padding:0 4px;border-radius:999px;display:inline-grid;place-items:center;font-size:11.5px;line-height:1;font-variant-numeric:tabular-nums;color:var(--c-ink-3)">{{ B.n }}</span>
<span style="flex:1;min-width:0"></span>
<sc-if value="{{ B.wideTools }}" hint-placeholder-val="{{ true }}">
<div data-part="segmented-control" style="flex:none;display:flex;padding:2px;border-radius:999px;box-shadow:inset 0 0 0 1px var(--c-line-strong)"><sc-for list="{{ B.zooms }}" as="o" hint-placeholder-count="3"><button data-part="option" data-state="{{ o.state }}" onClick="{{ o.go }}" style="appearance:none;border:0;height:24px;padding:0 8px;border-radius:999px;font:inherit;font-size:11.5px;font-weight:500;letter-spacing:.01em;background:{{ o.bg }};color:{{ o.fg }};cursor:pointer;white-space:nowrap;transition:background 240ms,color 240ms" data-id="moodboard.option.go">{{ o.t }}</button></sc-for></div>
</sc-if>
<sc-for list="{{ B.tools }}" as="x" hint-placeholder-count="3">
<button data-part="symbol-button" data-state="{{ x.state }}" style-active="transform:scale(.96)" title="{{ x.label }}" aria-label="{{ x.label }}" onClick="{{ x.go }}" style="appearance:none;border:0;padding:0;font:inherit;flex:none;width:28px;height:28px;border-radius:999px;display:grid;place-items:center;background:{{ x.bg }};color:{{ x.fg }};box-shadow:{{ x.ring }};cursor:pointer;transition:background 160ms,color 160ms" data-id="moodboard.symbol-button.go"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="{{ x.d }}"></path></svg></button>
</sc-for>
</header>
<div data-part="context-bar" style="flex:none;height:40px;display:flex;align-items:center;gap:12px;padding:0 16px;box-sizing:border-box;box-shadow:inset 0 -1px 0 var(--c-line);min-width:0;overflow:hidden"><sc-for list="{{ B.ctx }}" as="c" hint-placeholder-count="2">
<sc-if value="{{ c.isHint }}" hint-placeholder-val="{{ true }}"><span style="flex:0 1 auto;min-width:0;font-size:11.5px;color:var(--c-ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ c.text }}</span></sc-if>
<sc-if value="{{ c.isSeg }}" hint-placeholder-val="{{ false }}"><div data-part="segmented-control" style="flex:none;display:flex;padding:2px;border-radius:999px;box-shadow:inset 0 0 0 1px var(--c-line-strong)"><sc-for list="{{ c.seg }}" as="o" hint-placeholder-count="3"><button data-part="option" data-state="{{ o.state }}" title="{{ o.tip }}" onClick="{{ o.go }}" style="appearance:none;border:0;height:24px;min-width:24px;padding:0 8px;border-radius:999px;font:inherit;font-size:11.5px;font-weight:500;background:{{ o.bg }};color:{{ o.fg }};cursor:pointer;white-space:nowrap" data-id="moodboard.option.go-2">{{ o.n }}</button></sc-for></div></sc-if>
<sc-if value="{{ c.isBtn }}" hint-placeholder-val="{{ false }}"><button data-part="text-button" data-state="{{ c.state }}" style-active="transform:scale(.96)" style-hover="background:var(--c-hover)" onClick="{{ c.go }}" style="appearance:none;border:0;flex:none;height:24px;padding:0 12px;border-radius:999px;font:inherit;font-size:11.5px;font-weight:500;background:{{ c.bg }};color:{{ c.fg }};box-shadow:{{ c.ring }};cursor:pointer;white-space:nowrap;transition:background 160ms" data-id="moodboard.text-button.go">{{ c.label }}</button></sc-if>
<sc-if value="{{ c.isPill }}" hint-placeholder-val="{{ false }}"><button data-part="choice" onClick="{{ c.go }}" style="appearance:none;border:0;flex:none;height:28px;padding:0 8px 0 12px;border-radius:999px;display:flex;align-items:center;gap:8px;font:inherit;background:transparent;color:var(--c-ink);box-shadow:inset 0 0 0 1px var(--c-line-strong);cursor:pointer;white-space:nowrap" data-id="moodboard.choice.go">{{ c.label }}<svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="{{ chevronD }}"></path></svg></button></sc-if>
<sc-if value="{{ c.isSw }}" hint-placeholder-val="{{ false }}"><span style="flex:none;display:flex;gap:4px"><sc-for list="{{ c.sw }}" as="sw" hint-placeholder-count="6"><button data-part="swatch" data-state="{{ sw.state }}" title="{{ sw.n }}" aria-label="{{ sw.n }}" onClick="{{ sw.go }}" style="appearance:none;border:0;padding:0;flex:none;width:20px;height:20px;border-radius:50%;background:{{ sw.c }};box-shadow:{{ sw.ring }};cursor:pointer" style-active="transform:scale(.92)" data-id="moodboard.swatch.go"></button></sc-for></span></sc-if>
</sc-for></div>
<div data-part="tool-palette" ref="{{ palRef }}" style="position:absolute;left:{{ B.palL }};top:{{ B.palT }};z-index:6;padding:0 8px 8px;border-radius:12px;background:var(--c-menu);box-shadow:var(--sh-float);display:flex;flex-direction:column;gap:4px"><div data-part="drag-handle" title="Ziehen verschiebt, Doppelklick dockt an" onPointerDown="{{ B.palDown }}" onDoubleClick="{{ B.palDock }}" style="flex:none;height:16px;margin:0 -8px;display:grid;place-items:center;cursor:grab;touch-action:none" data-id="moodboard.drag-handle.pal-down"><i style="display:block;width:16px;height:4px;background:radial-gradient(circle,var(--c-ink-3) 1px,transparent 1.5px) 0 0/4px 4px"></i></div><sc-for list="{{ B.palette }}" as="x" hint-placeholder-count="6"><sc-if value="{{ x.sep }}" hint-placeholder-val="{{ false }}"><i data-part="divider" style="flex:none;height:1px;margin:2px 6px;background:var(--c-line)"></i></sc-if><sc-if value="{{ x.isBtn }}" hint-placeholder-val="{{ true }}"><button data-part="symbol-button" data-state="{{ x.state }}" title="{{ x.label }}" aria-label="{{ x.label }}" onClick="{{ x.go }}" onPointerDown="{{ x.stop }}" style="appearance:none;border:0;padding:0;font:inherit;flex:none;width:28px;height:28px;border-radius:999px;display:grid;place-items:center;background:{{ x.bg }};color:{{ x.fg }};cursor:pointer;transition:background 160ms,color 160ms" style-hover="background:{{ x.hbg }}" style-active="transform:scale(.96)" data-id="moodboard.symbol-button.go-2"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="{{ x.d }}"></path></svg></button></sc-if></sc-for></div>
<div data-part="desk" ref="{{ deskRef }}" onPointerDown="{{ B.deskDown }}" onDragOver="{{ B.dragOver }}" onDrop="{{ B.drop }}" style="flex:1;min-height:0;overflow:auto;scrollbar-width:thin;background:var(--c-well)" data-id="moodboard.desk.desk-down">
<div style="min-width:100%;min-height:100%;box-sizing:border-box;padding:32px 32px 32px 64px;display:flex;align-items:safe center;justify-content:safe center">
<div style="position:relative;flex:none;width:{{ B.w }};height:{{ B.h }}">
<div ref="{{ pageRef }}" data-part="board" data-state="{{ B.state }}" onPointerDown="{{ B.pageDown }}" style="cursor:{{ B.cur }};position:absolute;left:0;top:0;width:100%;height:100%;background:{{ B.pageBg }};box-shadow:0 0 0 1px var(--c-line),var(--sh-float);border-radius:2px;overflow:hidden;color-scheme:light" data-id="moodboard.board.page-down">
<sc-if value="{{ B.raster }}" hint-placeholder-val="{{ true }}">
<sc-for list="{{ B.cols }}" as="c" hint-placeholder-count="12"><i aria-hidden="true" style="position:absolute;left:{{ c.l }};top:{{ B.mt }};width:{{ c.w }};height:{{ B.mh }};background:rgba(179,65,46,.045);pointer-events:none"></i></sc-for>
<i aria-hidden="true" style="position:absolute;left:{{ B.ml }};top:{{ B.mt }};width:{{ B.mw }};height:{{ B.mh }};box-shadow:0 0 0 1px rgba(179,65,46,.5);pointer-events:none"></i>
</sc-if>
<sc-for list="{{ B.items }}" as="it" hint-placeholder-count="5">
<div data-part="board-item" data-state="{{ it.state }}" data-kind="{{ it.kind }}" onPointerDown="{{ it.down }}" onDoubleClick="{{ it.dbl }}" style="position:absolute;left:{{ it.l }};top:{{ it.t }};width:{{ it.w }};height:{{ it.h }};transform:{{ it.tf }};opacity:{{ it.op }};border-radius:{{ it.r }};background-color:{{ it.bg }};background-image:{{ it.bgi }};background-size:{{ it.bgs }};box-shadow:{{ it.ring }};cursor:{{ it.cur }};overflow:hidden;user-select:none" data-id="moodboard.board-item.down">
<sc-if value="{{ it.isImg }}" hint-placeholder-val="{{ false }}"><span style="position:absolute;left:0;top:0;width:100%;height:100%;background-image:{{ it.srcCss }};background-repeat:no-repeat;background-size:{{ it.fitCss }};background-position:center;transform:{{ it.imgTf }};pointer-events:none"></span></sc-if>
<sc-if value="{{ it.isTone }}" hint-placeholder-val="{{ false }}"><span style="position:absolute;left:0;bottom:0;width:100%;padding:{{ it.pad }};box-sizing:border-box;font-family:Geist,system-ui,sans-serif;font-size:{{ it.capS }};color:#171717;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none">{{ it.label }}</span></sc-if>
<sc-if value="{{ it.isWord }}" hint-placeholder-val="{{ false }}"><span style="position:absolute;left:0;top:0;width:100%;height:100%;display:grid;place-items:center;font-family:Geist,system-ui,sans-serif;font-weight:500;font-size:{{ it.wordS }};letter-spacing:-.01em;color:#171717;pointer-events:none;white-space:nowrap">{{ it.word }}</span></sc-if>
<sc-if value="{{ it.isFlaeche }}" hint-placeholder-val="{{ false }}"><span style="position:absolute;left:0;bottom:0;width:100%;padding:{{ it.pad }};box-sizing:border-box;font-family:Geist,system-ui,sans-serif;font-size:{{ it.capS }};color:{{ it.capFg }};white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none">{{ it.label }}</span></sc-if>
<sc-if value="{{ it.isText }}" hint-placeholder-val="{{ false }}"><span style="display:block;width:100%;height:100%;font-family:{{ it.fam }};font-size:{{ it.fs }};line-height:{{ it.lh }};font-weight:{{ it.fw }};letter-spacing:{{ it.ls }};text-align:{{ it.ta }};color:{{ it.c }};white-space:pre-wrap;overflow:hidden;text-wrap:pretty;pointer-events:none">{{ it.text }}</span></sc-if>
<sc-if value="{{ it.editing }}" hint-placeholder-val="{{ false }}"><textarea data-editing="1" value="{{ it.text }}" onChange="{{ it.onText }}" onBlur="{{ it.endEdit }}" onPointerDown="{{ it.stopP }}" spellcheck="false" style="position:absolute;left:0;top:0;width:100%;height:100%;box-sizing:border-box;margin:0;padding:0;border:0;outline:0;resize:none;background:rgba(255,255,255,.9);font-family:{{ it.fam }};font-size:{{ it.fs }};line-height:{{ it.lh }};font-weight:{{ it.fw }};letter-spacing:{{ it.ls }};text-align:{{ it.ta }};color:#171717"></textarea></sc-if>
</div>
</sc-for>
</div>
<div data-part="board-overlay" style="position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none">
<sc-for list="{{ B.guides }}" as="gd" hint-placeholder-count="0"><i style="position:absolute;left:{{ gd.l }};top:{{ gd.t }};width:{{ gd.w }};height:{{ gd.h }};background:var(--c-signal)"></i></sc-for>
<sc-if value="{{ B.hasMarq }}" hint-placeholder-val="{{ false }}"><i style="position:absolute;left:{{ B.marq.l }};top:{{ B.marq.t }};width:{{ B.marq.w }};height:{{ B.marq.h }};background:rgba(23,23,23,.06);box-shadow:inset 0 0 0 1px #171717"></i></sc-if>
<sc-for list="{{ B.outlines }}" as="o" hint-placeholder-count="0"><i style="position:absolute;left:{{ o.l }};top:{{ o.t }};width:{{ o.w }};height:{{ o.h }};transform:{{ o.tf }};box-shadow:0 0 0 1px #171717,0 0 0 2px #ffffff"></i></sc-for>
<sc-if value="{{ B.hasSel }}" hint-placeholder-val="{{ false }}"><div data-part="selection" style="position:absolute;left:{{ B.sel.l }};top:{{ B.sel.t }};width:{{ B.sel.w }};height:{{ B.sel.h }};transform:{{ B.sel.tf }};box-shadow:0 0 0 1px #171717,0 0 0 2px #ffffff">
<sc-for list="{{ B.sel.handles }}" as="h" hint-placeholder-count="8"><span title="Größe" onPointerDown="{{ h.down }}" style="position:absolute;left:{{ h.l }};top:{{ h.t }};width:9px;height:9px;transform:translate(-50%,-50%);background:#ffffff;box-shadow:0 0 0 1px #171717;cursor:{{ h.cur }};pointer-events:auto"></span></sc-for>
<sc-if value="{{ B.sel.hasRot }}" hint-placeholder-val="{{ false }}"><i style="position:absolute;left:50%;top:-20px;width:1px;height:20px;background:#171717"></i><span title="Drehen" onPointerDown="{{ B.sel.rotDown }}" style="position:absolute;left:50%;top:-26px;width:11px;height:11px;transform:translate(-50%,-50%);border-radius:50%;background:#ffffff;box-shadow:0 0 0 1px #171717;cursor:grab;pointer-events:auto"></span></sc-if>
</div></sc-if>
</div>
</div>
</div>
</div>
</sc-if>
</div>

<div data-slot="2" style="display:contents">

<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<span ref="{{ boxRef }}" data-part="destructive-control" data-state="{{ phase }}" style="position:relative;display:inline-block;flex:none;vertical-align:middle;height:28px;width:{{ boxW }};border-radius:999px;overflow:hidden;background:var(--c-lane);color:var(--c-ink);font-size:13px;line-height:18px;box-shadow:{{ boxRing }};transition:{{ boxTr }}">
<span ref="{{ rRef }}" style="position:absolute;left:0;top:0;height:28px;display:flex;align-items:center;white-space:nowrap;opacity:{{ L.r.op }};filter:{{ L.r.fl }};pointer-events:{{ L.r.pe }};transition:{{ layerTr }}">
<button data-part="text-button" data-state="destructive" title="{{ label }}" aria-label="{{ label }}" onClick="{{ toFrage }}" style-active="transform:scale(.97)" style="appearance:none;border:0;font:inherit;height:28px;width:{{ rW }};padding:{{ rPad }};border-radius:999px;display:flex;align-items:center;justify-content:center;gap:8px;background:transparent;color:var(--c-signal);cursor:pointer;white-space:nowrap">
<sc-if value="{{ hasIcon }}" hint-placeholder-val="{{ true }}"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" style="flex:none"><path d="{{ d }}"></path></svg></sc-if>
<sc-if value="{{ hasLabel }}" hint-placeholder-val="{{ true }}"><span>{{ label }}</span></sc-if>
</button>
</span>
<span ref="{{ fRef }}" style="position:absolute;left:0;top:0;height:28px;display:flex;align-items:center;gap:8px;padding:0 4px 0 {{ fPadL }};white-space:nowrap;opacity:{{ L.f.op }};filter:{{ L.f.fl }};pointer-events:{{ L.f.pe }};transition:{{ layerTr }}">
<sc-if value="{{ hasFrage }}" hint-placeholder-val="{{ true }}"><span style="flex:none">{{ frage }}</span></sc-if>
<button data-part="text-button" data-state="neutral" onClick="{{ nein }}" style-active="transform:scale(.97)" style-hover="background:var(--c-hover);color:var(--c-ink)" style="appearance:none;border:0;font:inherit;font-size:11.5px;font-weight:500;letter-spacing:.01em;height:20px;padding:0 8px;border-radius:999px;background:transparent;color:var(--c-ink-2);cursor:pointer;white-space:nowrap;transition:background 160ms,color 160ms">{{ neinText }}</button>
<button data-part="text-button" data-state="{{ jaState }}" title="{{ jaTip }}" onPointerDown="{{ jaDown }}" onPointerUp="{{ jaUp }}" onPointerLeave="{{ jaUp }}" onPointerCancel="{{ jaUp }}" onKeyDown="{{ jaKey }}" onContextMenu="{{ noMenu }}" style="appearance:none;border:0;font:inherit;font-size:11.5px;font-weight:500;letter-spacing:.01em;position:relative;overflow:hidden;height:20px;padding:0 8px;border-radius:999px;background:color-mix(in srgb, var(--c-signal) 12%, transparent);color:var(--c-signal);cursor:pointer;white-space:nowrap;touch-action:none;user-select:none"><span>{{ ja }}</span><span aria-hidden="true" style="position:absolute;inset:0;display:grid;place-items:center;background:var(--c-signal);color:var(--c-on-signal);clip-path:{{ clip }};transition:{{ clipTr }}">{{ ja }}</span></button>
</span>
<span ref="{{ lRef }}" style="position:absolute;left:0;top:0;height:28px;display:flex;align-items:center;gap:8px;padding:0 12px 0 8px;white-space:nowrap;color:var(--c-ink-3);opacity:{{ L.l.op }};filter:{{ L.l.fl }};pointer-events:{{ L.l.pe }};transition:{{ layerTr }}">
<svg ref="{{ spinRef }}" width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" style="flex:none"><circle cx="8" cy="8" r="6" stroke-opacity=".3"></circle><path d="M8 2a6 6 0 0 1 6 6"></path></svg>
<span>{{ laeuft }}</span>
</span>
<span ref="{{ dRef }}" style="position:absolute;left:0;top:0;height:28px;display:flex;align-items:center;gap:8px;padding:0 4px 0 4px;white-space:nowrap;opacity:{{ L.d.op }};filter:{{ L.d.fl }};pointer-events:{{ L.d.pe }};transition:{{ layerTr }}">
<span style="flex:none;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:var(--c-inv);color:var(--c-on-inv)"><svg width="10" height="10" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 8.5l3 3 6-7"></path></svg></span>
<span>{{ fertig }}</span>
<sc-if value="{{ hasUndo }}" hint-placeholder-val="{{ true }}"><button data-part="text-button" data-state="neutral" onClick="{{ undo }}" style-active="transform:scale(.97)" style-hover="background:var(--c-hover)" style="appearance:none;border:0;font:inherit;font-size:11.5px;font-weight:500;letter-spacing:.01em;height:20px;padding:0 8px;border-radius:999px;background:transparent;color:var(--c-ink);box-shadow:inset 0 0 0 1px var(--c-line-strong);cursor:pointer;white-space:nowrap;transition:background 160ms">{{ rueckgaengig }}</button></sc-if>
</span>
</span>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;label&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Trennen&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Texte&quot;},&quot;frage&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Google trennen?&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Texte&quot;},&quot;ja&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Trennen&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Texte&quot;},&quot;nein&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Abbrechen&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Texte&quot;},&quot;laeuft&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Wird getrennt …&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Texte&quot;},&quot;fertig&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Getrennt&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Texte&quot;},&quot;rueckgaengig&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Rückgängig&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Texte&quot;},&quot;start&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;ruhe&quot;,&quot;frage&quot;],&quot;default&quot;:&quot;ruhe&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Verhalten&quot;},&quot;halten&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:500,&quot;min&quot;:0,&quot;max&quot;:1500,&quot;step&quot;:50,&quot;unit&quot;:&quot;ms&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Verhalten&quot;},&quot;dauer&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:700,&quot;min&quot;:0,&quot;max&quot;:3000,&quot;step&quot;:100,&quot;unit&quot;:&quot;ms&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Verhalten&quot;},&quot;verlauf&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Verhalten&quot;},&quot;phase&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;&quot;,&quot;ruhe&quot;,&quot;frage&quot;,&quot;halten&quot;,&quot;laeuft&quot;,&quot;fertig&quot;],&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Vorschau&quot;},&quot;d&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;string&quot;},&quot;onJa&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; any&quot;},&quot;onNein&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;},&quot;onFertig&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;},&quot;onRueckgaengig&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;}}">
class Component extends DCLogic {
  state = this.initial();
  initial() { return { phase: (this.props || {}).start === "frage" ? "frage" : "ruhe", w: 0, anim: false, hx: 24, hr: 80 }; }
  boxRef = React.createRef(); rRef = React.createRef(); fRef = React.createRef(); lRef = React.createRef(); dRef = React.createRef(); spinRef = React.createRef();
  still() { try { return matchMedia("(prefers-reduced-motion: reduce)").matches; } catch (e) { return false; } }
  cur() { return this.props.phase || this.state.phase; }
  componentDidMount() { this.measure(); this.spin(); this.onKey = e => { if (e.key === "Escape" && ["frage", "halten"].includes(this.state.phase) && this.boxRef.current && this.boxRef.current.contains(document.activeElement)) this.nein(); }; document.addEventListener("keydown", this.onKey); }
  componentWillUnmount() { document.removeEventListener("keydown", this.onKey); [this.ht, this.ft, this.dt].forEach(clearTimeout); }
  componentDidUpdate() { this.measure(); this.spin(); }
  measure() {
    const ph = this.cur(), el = ({ ruhe: this.rRef, frage: this.fRef, halten: this.fRef, laeuft: this.lRef, fertig: this.dRef })[ph];
    const node = el && el.current; if (!node) return;
    const w = Math.ceil(node.getBoundingClientRect().width);
    if (w && w !== this.state.w) this.setState({ w, anim: this.state.w > 0 });
  }
  spin() { const s = this.spinRef.current; if (s && !s._a && s.animate && !this.still()) s._a = s.animate([{ transform: "rotate(0deg)" }, { transform: "rotate(360deg)" }], { duration: 900, iterations: Infinity }); }
  toFrage = () => { if (this.props.phase) return; this.setState({ phase: "frage" }, () => { const b = this.fRef.current && this.fRef.current.querySelector("button:last-of-type"); if (b) b.focus({ preventScroll: true }); }); };
  nein = () => { if (this.props.phase) return; clearTimeout(this.ht); this.setState({ phase: this.props.start === "frage" ? "frage" : "ruhe" }, () => { if (this.props.onNein) this.props.onNein(); }); };
  jaDown = e => {
    if (this.props.phase || e.button > 0) return;
    const halten = this.props.halten ?? 500;
    if (!halten || this.still()) { this.commit(); return; }
    const r = e.currentTarget.getBoundingClientRect(), x = e.clientX - r.left;
    this.setState({ phase: "halten", hx: Math.round(x), hr: Math.ceil(Math.max(x, r.width - x)) + 12 });
    clearTimeout(this.ht); this.ht = setTimeout(() => this.commit(), halten);
  };
  jaUp = () => { if (this.props.phase || this.state.phase !== "halten") return; clearTimeout(this.ht); this.setState({ phase: "frage" }); };
  jaKey = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); if (!this.props.phase) this.commit(); } };
  commit() {
    clearTimeout(this.ht);
    const verlauf = this.props.verlauf ?? !!this.props.fertig;
    if (!verlauf) { this.setState({ phase: this.props.start === "frage" ? "frage" : "ruhe" }); if (this.props.onJa) this.props.onJa(); return; }
    this.setState({ phase: "laeuft" });
    const t0 = Date.now(), r = this.props.onJa ? this.props.onJa() : null, dauer = this.props.dauer ?? 700;
    Promise.resolve(r).then(() => { this.dt = setTimeout(() => {
      this.setState({ phase: "fertig" });
      if (this.props.ohneRueckgaengig) { this.ft = setTimeout(() => this.finish(), 1800); } else this.ft = setTimeout(() => this.finish(), 4000);
    }, Math.max(0, dauer - (Date.now() - t0))); });
  }
  finish() { if (this.props.onFertig) this.props.onFertig(); this.setState({ phase: "ruhe" }); }
  undo = () => { clearTimeout(this.ft); this.setState({ phase: "ruhe" }, () => { if (this.props.onRueckgaengig) this.props.onRueckgaengig(); }); };
  renderVals() {
    const p = this.props, ph = this.cur(), s = this.state, still = this.still();
    const ease = "cubic-bezier(.2,.8,.2,1)", label = p.label ?? "", hasIcon = !!p.d, hasLabel = !!label;
    const fort = p.phase === "halten" ? (p.fortschritt ?? .55) : null;
    const lay = on => ({ op: on ? 1 : 0, fl: on || still ? "none" : "blur(3px)", pe: on ? "auto" : "none" });
    const on = { ruhe: ph === "ruhe", frage: ph === "frage" || ph === "halten", laeuft: ph === "laeuft", fertig: ph === "fertig" };
    const holding = ph === "halten";
    const r = fort !== null ? Math.round(46 * fort) : holding ? s.hr : 0, hx = fort !== null ? 24 : s.hx;
    const ring = ph === "ruhe" ? "inset 0 0 0 1px var(--c-signal)" : ph === "fertig" ? "inset 0 0 0 1px var(--c-line)" : "inset 0 0 0 1px var(--c-line-strong)";
    return {
      boxRef: this.boxRef, rRef: this.rRef, fRef: this.fRef, lRef: this.lRef, dRef: this.dRef, spinRef: this.spinRef, phase: ph,
      boxW: s.w ? s.w + "px" : "auto", boxRing: ring, boxTr: still || !s.anim ? "none" : "width 320ms " + ease + ",box-shadow 200ms",
      layerTr: still ? "none" : "opacity 200ms " + ease + ",filter 200ms " + ease,
      L: { r: lay(on.ruhe), f: lay(on.frage), l: lay(on.laeuft), d: lay(on.fertig) },
      label, d: p.d || "", hasIcon, hasLabel, rW: hasLabel ? "auto" : "28px", rPad: hasLabel ? (hasIcon ? "0 12px 0 8px" : "0 12px") : "0",
      frage: p.frage ?? "", hasFrage: !!p.frage, fPadL: p.frage ? "12px" : "4px", neinText: p.nein ?? "Abbrechen", ja: p.ja ?? "Löschen", jaTip: p.hinweis ?? "", jaState: holding ? "pressed" : "destructive",
      laeuft: p.laeuft ?? "Wird gelöscht …", fertig: p.fertig ?? "Erledigt", rueckgaengig: p.rueckgaengig ?? "Rückgängig", hasUndo: !p.ohneRueckgaengig,
      clip: "circle(" + r + "px at " + hx + "px 10px)", clipTr: fort !== null || still ? "none" : holding ? "clip-path " + (p.halten ?? 500) + "ms linear" : "clip-path 180ms " + ease,
      toFrage: this.toFrage, nein: this.nein, jaDown: this.jaDown, jaUp: this.jaUp, jaKey: this.jaKey, undo: this.undo, noMenu: e => e.preventDefault()
    };
  }
}
</script>
</body>
</html>

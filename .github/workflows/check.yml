name: check

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Commit message
        run: python3 -I utils/commit_check.py --rev HEAD
      - name: Schema
        run: python3 -I utils/check.py
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      - name: Generate project
        run: brew install xcodegen && xcodegen generate
      - name: Build app
        run: >
          xcodebuild -project ALFA_OS.xcodeproj -scheme ALFA_OS
          -destination 'platform=macOS' -derivedDataPath build
          CODE_SIGNING_ALLOWED=NO build

name: ALFA_OS

options:
  developmentLanguage: de
  deploymentTarget:
    macOS: "26.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    DEVELOPMENT_TEAM: 28Z2KHMANG
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
    MARKETING_VERSION: "0.1.10"
    CURRENT_PROJECT_VERSION: "10"

packages:
  AlfaKit:
    path: Kit

targets:
  ALFA_OS:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes:
          - Resources/**
      - path: App/Resources
        buildPhase: resources
      - path: ../gestaltung/alfa-interface/tokens.json
        buildPhase: resources
    dependencies:
      - package: AlfaKit
        product: ShellCore
      - package: AlfaKit
        product: Hub
      - package: AlfaKit
        product: Mail
    info:
      path: Config/Info.plist
      properties:
        CFBundleName: ALFA_OS
        CFBundleDisplayName: ALFA_OS
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        LSApplicationCategoryType: public.app-category.productivity
        CFBundleDevelopmentRegion: de
    postBuildScripts:
      - name: Branch
        basedOnDependencyAnalysis: false
        inputFiles:
          - $(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)
        script: |
          plist="$TARGET_BUILD_DIR/$INFOPLIST_PATH"
          branch=$(git -C "$SRCROOT" rev-parse --abbrev-ref HEAD 2>/dev/null) || exit 0
          commit=$(git -C "$SRCROOT" rev-parse --short HEAD 2>/dev/null) || exit 0
          /usr/libexec/PlistBuddy -c "Delete :ALFABranch" "$plist" >/dev/null 2>&1
          /usr/libexec/PlistBuddy -c "Delete :ALFACommit" "$plist" >/dev/null 2>&1
          /usr/libexec/PlistBuddy -c "Add :ALFABranch string $branch" "$plist"
          /usr/libexec/PlistBuddy -c "Add :ALFACommit string $commit" "$plist"
    entitlements:
      path: Config/ALFA_OS.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.network.server: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.johannesleoberger.alfaos
        PRODUCT_NAME: ALFA_OS
        SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_APP_SANDBOX: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_OUTGOING_NETWORK_CONNECTIONS: YES

  ALFA_OSTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
      - path: App
        excludes:
          - Resources/**
          - ALFA_OSApp.swift
      - path: App/Resources
        buildPhase: resources
      - path: ../gestaltung/alfa-interface/tokens.json
        buildPhase: resources
    dependencies:
      - package: AlfaKit
        product: ShellCore
      - package: AlfaKit
        product: Hub
      - package: AlfaKit
        product: Mail
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.johannesleoberger.alfaos.tests

<!DOCTYPE html>
<html>
<head>
<meta name="alfa-export" content="2026-10-18">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="lieferung-an-code/fonts/geist.css">
<link rel="stylesheet" href="alfa-theme.css">
<style>@keyframes alfaConfirmIn{from{opacity:0;filter:blur(3px)}to{opacity:1;filter:blur(0)}}@keyframes alfaConfirmSpin{to{transform:rotate(360deg)}}@media (prefers-reduced-motion:reduce){[data-part=confirm] *{animation:none!important}}</style>
</helmet>
<div data-part="confirm" data-state="{{ phase }}" style="position:relative;display:inline-flex;height:28px;vertical-align:middle">
<sc-if value="{{ sizer }}" hint-placeholder-val="{{ false }}"><div aria-hidden="true" style="visibility:hidden;display:flex;align-items:center;height:28px;box-sizing:border-box;padding:4px;font-family:Geist,-apple-system,system-ui,sans-serif;white-space:nowrap"><span style="height:20px;display:flex;align-items:center;gap:4px;padding:0 8px;font-size:11.5px;font-weight:500"><sc-if value="{{ hasIcon }}" hint-placeholder-val="{{ false }}"><span style="width:16px;height:16px;margin:0 -2px"></span></sc-if><sc-if value="{{ hasLabel }}" hint-placeholder-val="{{ true }}"><span style="display:grid;justify-items:center"><sc-for list="{{ sizes }}" as="v" hint-placeholder-count="0"><span aria-hidden="true" style="grid-area:1/1;visibility:hidden">{{ v }}</span></sc-for><span style="grid-area:1/1;position:relative">{{ label }}</span></span></sc-if></span></div></sc-if>
<div data-part="confirm-pill" style="position:{{ pillPos }};right:0;top:0;display:inline-flex;align-items:center;height:28px;box-sizing:border-box;border-radius:999px;padding:4px;font-family:Geist,-apple-system,system-ui,sans-serif;font-size:13px;line-height:18px;color:var(--c-ink);background:{{ pillBg }};box-shadow:{{ pillRing }};white-space:nowrap">
<sc-if value="{{ isRuhe }}" hint-placeholder-val="{{ true }}">
<button data-part="confirm-open" onClick="{{ openAsk }}" style="all:unset;box-sizing:border-box;height:20px;display:flex;align-items:center;gap:4px;padding:0 8px;border-radius:999px;cursor:pointer;font-size:11.5px;font-weight:500;color:var(--c-ink-2);animation:alfaConfirmIn 200ms cubic-bezier(.2,.8,.2,1)" style-hover="background:var(--c-hover);color:var(--c-ink)" style-focus="outline:2px solid var(--c-focus);outline-offset:1px">
<sc-if value="{{ hasIcon }}" hint-placeholder-val="{{ false }}"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round" style="margin:0 -2px"><path d="{{ d }}"></path></svg></sc-if>
<sc-if value="{{ hasLabel }}" hint-placeholder-val="{{ true }}"><span style="display:grid;justify-items:center"><sc-for list="{{ sizes }}" as="v" hint-placeholder-count="0"><span aria-hidden="true" style="grid-area:1/1;visibility:hidden">{{ v }}</span></sc-for><span style="grid-area:1/1;position:relative">{{ label }}</span></span></sc-if>
</button>
</sc-if>
<sc-if value="{{ isAsk }}" hint-placeholder-val="{{ false }}">
<div style="display:flex;align-items:center;gap:8px;padding-left:8px;animation:alfaConfirmIn 200ms cubic-bezier(.2,.8,.2,1)">
<span style="color:var(--c-ink);font-size:13px">{{ frage }}</span>
<button data-part="confirm-no" onClick="{{ no }}" style="all:unset;box-sizing:border-box;height:20px;padding:0 8px;border-radius:999px;cursor:pointer;font-size:11.5px;font-weight:500;color:var(--c-ink-2)" style-hover="background:var(--c-hover);color:var(--c-ink)" style-focus="outline:2px solid var(--c-focus);outline-offset:1px">Nein</button>
<button data-part="confirm-yes" title="{{ tipText }}" onPointerDown="{{ down }}" onPointerUp="{{ up }}" onPointerLeave="{{ up }}" onPointerCancel="{{ up }}" onKeyDown="{{ key }}" style="all:unset;box-sizing:border-box;position:relative;overflow:hidden;height:20px;padding:0 8px;border-radius:999px;cursor:pointer;font-size:11.5px;font-weight:500;color:var(--c-signal);box-shadow:inset 0 0 0 1px var(--c-signal);touch-action:none;user-select:none;transform:translateX({{ shake }}px);-webkit-mask-image:{{ erase }};mask-image:{{ erase }};filter:blur({{ eraseBlur }}px)" style-focus="outline:2px solid var(--c-focus);outline-offset:1px">
<span style="display:grid;justify-items:center"><sc-for list="{{ sizes }}" as="v" hint-placeholder-count="0"><span aria-hidden="true" style="grid-area:1/1;visibility:hidden">{{ v }}</span></sc-for><span style="grid-area:1/1;position:relative;color:{{ yesInk }}">{{ ja }}</span></span>
</button>
</div>
</sc-if>
<sc-if value="{{ isRun }}" hint-placeholder-val="{{ false }}">
<div style="display:flex;align-items:center;gap:8px;padding:0 8px;font-size:11.5px;font-weight:500;color:var(--c-ink-2);animation:alfaConfirmIn 200ms cubic-bezier(.2,.8,.2,1)"><span style="width:12px;height:12px;box-sizing:border-box;border-radius:50%;border:1.5px solid var(--c-line-strong);border-top-color:var(--c-ink);animation:alfaConfirmSpin 800ms linear infinite"></span><span>{{ laeuft }}</span></div>
</sc-if>
<sc-if value="{{ isDone }}" hint-placeholder-val="{{ false }}">
<div style="display:flex;align-items:center;gap:8px;padding:0 4px 0 8px;font-size:11.5px;font-weight:500;color:var(--c-ink);animation:alfaConfirmIn 200ms cubic-bezier(.2,.8,.2,1)"><span>{{ fertig }}</span>
<button data-part="confirm-undo" onClick="{{ undo }}" style="all:unset;box-sizing:border-box;height:20px;padding:0 8px;border-radius:999px;cursor:pointer;font-weight:500;color:var(--c-ink-2)" style-hover="background:var(--c-hover);color:var(--c-ink)" style-focus="outline:2px solid var(--c-focus);outline-offset:1px">Rückgängig</button></div>
</sc-if>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:260,&quot;height&quot;:40},&quot;label&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Trennen&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;frage&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Sicher?&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;ja&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Ja&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;laeuft&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Läuft …&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;fertig&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Fertig&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;phase&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;ruhe&quot;,&quot;frage&quot;,&quot;laeuft&quot;,&quot;fertig&quot;],&quot;default&quot;:&quot;ruhe&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;verlauf&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  state = { phase: null, fill: null, fx: 40 };
  raf = 0; t0 = 0; from = 0; dir = 0; timers = [];
  ph() { return this.state.phase || this.props.phase || this.props.start || "ruhe"; }
  componentWillUnmount() { cancelAnimationFrame(this.raf); this.timers.forEach(clearTimeout); }
  reduced() { return window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches; }
  openAsk = () => this.setState({ phase: "frage", fill: 0 });
  no = () => { this.stop(); this.setState({ phase: "ruhe", fill: 0 }); this.props.onNein && this.props.onNein(); };
  undo = () => { this.setState({ phase: "ruhe", fill: 0 }); };
  stop() { cancelAnimationFrame(this.raf); this.dir = 0; }
  down = (e) => {
    if (this.ph() !== "frage") return;
    if (this.reduced()) { this.confirm(); return; }
    const r = e.currentTarget.getBoundingClientRect();
    this.setState({ fx: Math.max(0, Math.min(r.width, e.clientX - r.left)) });
    this.run(1);
  };
  up = () => { if (this.ph() === "frage" && this.dir === 1) this.run(-1); };
  run(dir) {
    cancelAnimationFrame(this.raf);
    this.dir = dir; this.from = this.cur(); this.t0 = performance.now();
    const dur = dir === 1 ? 1000 * (1 - this.from) : 180 * this.from;
    const step = (now) => {
      const k = dur <= 0 ? 1 : Math.min(1, (now - this.t0) / dur);
      const v = this.from + (dir === 1 ? 1 - this.from : -this.from) * k;
      this.setState({ fill: v });
      if (k < 1) this.raf = requestAnimationFrame(step);
      else if (dir === 1) { this.dir = 0; this.confirm(); } else this.dir = 0;
    };
    this.raf = requestAnimationFrame(step);
  }
  cur() { return this.state.fill == null ? 0 : this.state.fill; }
  key = (e) => {
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); this.confirm(); }
    else if (e.key === "Escape") { e.preventDefault(); this.no(); }
  };
  confirm() {
    this.stop();
    if (this.props.onJa) this.props.onJa();
    if (this.props.verlauf === false) { this.setState({ phase: "ruhe", fill: 0 }); return; }
    this.setState({ phase: "laeuft", fill: 0 });
    this.timers.push(setTimeout(() => this.setState({ phase: "fertig" }), 900));
  }
  renderVals() {
    const p = this.ph(), pr = this.props, st = this.state;
    const fill = p === "frage" ? (st.fill == null ? (pr.fortschritt != null ? +pr.fortschritt : 0) : st.fill) : 0;
    const jb = pr.ja || "Ja", sizes = [pr.label || "", jb].filter(Boolean);
    const ask = p === "frage", anchored = st.phase != null && pr.start !== "frage" && !pr.phase;
    return {
      sizes, tipText: "Halten zum " + (pr.ja || "Bestätigen"), sizer: anchored, pillPos: anchored ? "absolute" : "relative", phase: p, isRuhe: p === "ruhe", isAsk: ask, isRun: p === "laeuft", isDone: p === "fertig",
      label: pr.label || "", hasLabel: !!pr.label, d: pr.d || "", hasIcon: !!pr.d,
      frage: pr.frage || "Sicher?", ja: pr.ja || "Ja", laeuft: pr.laeuft || "Läuft …", fertig: pr.fertig || "Fertig",
      pillBg: ask ? "var(--c-well)" : "transparent", pillRing: ask ? "inset 0 0 0 1px var(--c-line)" : "none",
      fill, erase: fill > 0 ? "linear-gradient(90deg, transparent " + (fill * 120 - 20).toFixed(1) + "%, #000 " + (fill * 120).toFixed(1) + "%)" : "none", eraseBlur: +(fill * 0.6).toFixed(2), shake: fill > 0.7 ? +(Math.sin(fill * 160) * 1.5 * (fill - 0.7) / 0.3).toFixed(2) : 0, yesInk: "var(--c-signal)",
      openAsk: this.openAsk, no: this.no, undo: this.undo, down: this.down, up: this.up, key: this.key
    };
  }
}
</script>
</body>
</html>

<!-- @dsCard group="Assistent" height=440 subtitle="Klick: Menü klappt wie eine Walze. Doppelklick: Assistent. Ziehen: an eine Seite kleben" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>Vorschau</title>
<style>html,body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--font-sans)}</style>
</head>
<body>
<div id="root" style="position:relative;height:440px"></div>
<script>
var A = window.ALFA, h = React.createElement;
var ITEMS = [
  { name: "Mail", count: 12, links: ["Eingang", "Gesendet", "Entwürfe"] }, { name: "Projekte", count: 8, links: ["Aktiv", "Angebote", "Archiv"] },
  { name: "Termine", count: 4, links: ["Heute", "Woche"] }, { name: "Zeiten", links: ["Erfassen", "Export"] }, { name: "Einstellungen" }
];
function Demo() {
  var s = React.useState("Mail");
  return h(A.BlobMenu, { items: ITEMS, current: s[0], notice: true, onSelect: function (n) { s[1](n); }, assistant: h(A.AssistantCard, { title: "Assistent" }) });
}
ReactDOM.createRoot(document.getElementById("root")).render(h(Demo));
</script>
</body>
</html>

<!-- @dsCard group="Schale" height=720 width=1280 subtitle="Layout-Schnitt Entwurf: Gerüst ohne Farben und Schriften" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>Entwurfsbogen</title>
<style>
/* Nur Maße. Keine Farb-Tokens, keine Schrift-Tokens: Farbe kommt aus currentColor, Schrift ist die des Browsers. */
html,body{margin:0;background:Canvas;color:CanvasText}
*{box-sizing:border-box}
.sheet{width:1280px;height:720px;padding:var(--component-lane-edge);display:grid;grid-template-columns:74px var(--component-lane-handle-width) minmax(0,1fr) var(--component-lane-handle-width) minmax(0,1.4fr);position:relative;overflow:hidden}
.lane{border-radius:var(--component-lane-radius);box-shadow:0 0 0 1px color-mix(in srgb,currentColor 18%,transparent);min-width:0;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.grip{align-self:center;justify-self:center;width:var(--component-lane-handle-thickness);height:var(--component-lane-handle-length);border-radius:var(--component-lane-handle-radius);background:color-mix(in srgb,currentColor 35%,transparent)}
.hd{height:var(--component-lane-header-height);flex:none;display:flex;align-items:center;gap:var(--space-s);padding:0 var(--space-m) 0 var(--space-l);border-bottom:1px solid color-mix(in srgb,currentColor 14%,transparent)}
.hd .sp,.sp{flex:1}
.bar{display:block;height:8px;border-radius:var(--component-lane-handle-radius);background:color-mix(in srgb,currentColor 16%,transparent)}
.bar.s{height:6px;margin-top:var(--space-s);background:color-mix(in srgb,currentColor 10%,transparent)}
.bar.t{height:10px;background:color-mix(in srgb,currentColor 70%,transparent)}
.dot{display:block;flex:none;width:var(--size-control-m);height:var(--size-control-m);border-radius:var(--radius-full);background:color-mix(in srgb,currentColor 10%,transparent)}
.dot.sm{width:var(--size-control-s);height:var(--size-control-s)}
.chip{display:block;flex:none;width:64px;height:var(--component-chip-height);border-radius:var(--radius-full);background:color-mix(in srgb,currentColor 10%,transparent)}
.chip.on{background:CanvasText}
/* Leiste */
.rail{align-items:center;padding-top:var(--space-l);gap:var(--space-s)}
.blob{position:relative;width:var(--component-lane-folded-width);height:var(--component-blob-height);margin-bottom:var(--space-l);border-radius:var(--radius-full);background:CanvasText;display:flex;align-items:center;justify-content:center}
.blob i{width:var(--size-control-m);height:var(--size-control-m);border-radius:var(--radius-full);border:1px solid Canvas;display:flex;gap:7px;align-items:center;justify-content:center}
.blob i::before,.blob i::after{content:"";width:3.5px;height:7px;border-radius:var(--radius-full);background:Canvas}
.rail .dot{width:var(--size-control-xl);height:var(--size-control-xl);background:transparent;border:1px solid color-mix(in srgb,currentColor 25%,transparent)}
/* Liste */
.list{overflow:hidden}
.row{display:flex;gap:var(--space-m);padding:var(--space-l);border-bottom:1px solid color-mix(in srgb,currentColor 10%,transparent)}
.av{flex:none;width:var(--size-control-l);height:var(--size-control-l);border-radius:var(--radius-full);background:color-mix(in srgb,currentColor 10%,transparent)}
.rb{flex:1;min-width:0}
.l1{display:flex;justify-content:space-between;margin-bottom:var(--space-s)}
.files{display:flex;gap:var(--space-s);margin-top:var(--space-s)}
.pill{display:flex;align-items:center;gap:var(--space-s);height:var(--size-control-l);padding:0 var(--space-m);border-radius:var(--radius-row);background:color-mix(in srgb,currentColor 8%,transparent)}
.pill .bar{margin:0}.sq{width:12px;height:14px;border:1px solid color-mix(in srgb,currentColor 40%,transparent);border-radius:2px}
/* Entwurf */
.field{display:flex;align-items:center;gap:var(--space-m);height:var(--size-control-xl);padding:0 var(--space-l);border-bottom:1px solid color-mix(in srgb,currentColor 14%,transparent)}
.field .lab{width:72px}
.field .val{flex:1}
.field .chp{width:150px;height:var(--size-control-s);border-radius:var(--radius-full);background:color-mix(in srgb,currentColor 10%,transparent)}
.tools{display:flex;gap:var(--space-xs);padding:var(--space-xs) var(--space-m);border-bottom:1px solid color-mix(in srgb,currentColor 14%,transparent)}
.write{flex:1;min-height:0}
.sign{display:flex;gap:var(--space-l);padding:var(--space-l);border-top:1px solid color-mix(in srgb,currentColor 14%,transparent)}
.sign .bar.s:first-child{margin-top:0}
.foot{display:flex;align-items:center;gap:var(--space-xs);padding:var(--space-s) var(--space-m);border-top:1px solid color-mix(in srgb,currentColor 14%,transparent)}
.send{width:96px;height:var(--size-control-m);border-radius:var(--radius-full);background:CanvasText}
.note{position:absolute;right:var(--component-lane-edge);bottom:4px;font-size:9px;opacity:.5}
</style></head>
<body>
<div class="sheet">
  <section class="lane rail" aria-label="Leiste"><div class="blob"><i></i></div><i class="dot"></i><i class="dot"></i><i class="dot"></i><i class="dot"></i><i class="dot"></i><i class="dot"></i></section>
  <div class="grip"></div>
  <section class="lane list" aria-label="Liste">
    <div class="hd"><b class="bar t" style="width:64px"></b><span class="sp"></span><i class="chip on" style="width:58px"></i><i class="chip"></i><i class="chip" style="width:84px"></i><i class="dot"></i></div>
    <div class="row"><i class="av"></i><div class="rb"><div class="l1"><b class="bar" style="width:90px"></b><b class="bar s" style="width:70px"></b></div><b class="bar" style="width:200px"></b><b class="bar s"></b><b class="bar s" style="width:70%"></b></div></div><div class="row"><i class="av"></i><div class="rb"><div class="l1"><b class="bar" style="width:104px"></b><b class="bar s" style="width:70px"></b></div><b class="bar" style="width:190px"></b><b class="bar s"></b><b class="bar s" style="width:70%"></b></div></div><div class="row"><i class="av"></i><div class="rb"><div class="l1"><b class="bar" style="width:118px"></b><b class="bar s" style="width:70px"></b></div><b class="bar" style="width:180px"></b><b class="bar s"></b><b class="bar s" style="width:70%"></b><div class="files"><span class="pill"><i class="sq"></i><b class="bar s" style="width:70px"></b></span><span class="pill"><i class="sq"></i><b class="bar s" style="width:70px"></b></span></div></div></div><div class="row"><i class="av"></i><div class="rb"><div class="l1"><b class="bar" style="width:132px"></b><b class="bar s" style="width:70px"></b></div><b class="bar" style="width:170px"></b><b class="bar s"></b><b class="bar s" style="width:70%"></b><div class="files"><span class="pill"><i class="sq"></i><b class="bar s" style="width:70px"></b></span><span class="pill"><i class="sq"></i><b class="bar s" style="width:70px"></b></span></div></div></div><div class="row"><i class="av"></i><div class="rb"><div class="l1"><b class="bar" style="width:146px"></b><b class="bar s" style="width:70px"></b></div><b class="bar" style="width:160px"></b><b class="bar s"></b><b class="bar s" style="width:70%"></b></div></div>
  </section>
  <div class="grip"></div>
  <section class="lane" aria-label="Entwurf">
    <div class="hd"><b class="bar t" style="width:120px"></b><span class="sp"></span><i class="dot"></i><i class="dot"></i><i class="dot"></i></div>
    <div class="field"><b class="bar lab"></b><i class="chp"></i></div>
    <div class="field"><b class="bar lab"></b><b class="bar val" style="max-width:180px"></b><span class="sp"></span><i class="dot sm"></i></div>
    <div class="field"><b class="bar lab"></b><b class="bar val" style="max-width:120px"></b></div>
    <div class="tools"><i class="dot sm"></i><i class="dot sm"></i><i class="dot sm"></i><i class="dot sm"></i><i class="dot sm"></i><i class="dot sm"></i><i class="dot sm"></i></div>
    <div class="write"></div>
    <div class="sign"><i class="av"></i><div style="flex:1"><b class="bar s" style="width:240px"></b><b class="bar s" style="width:140px"></b><b class="bar s" style="width:300px"></b><b class="bar s" style="width:180px"></b><b class="bar s" style="width:150px"></b></div></div>
    <div class="foot"><i class="dot sm"></i><i class="dot sm"></i><span class="sp"></span><i class="send"></i></div>
  </section>
  <div class="note">Gerüst: nur Maße, keine Farb- und Schrift-Tokens</div>
</div>
</body>
</html>

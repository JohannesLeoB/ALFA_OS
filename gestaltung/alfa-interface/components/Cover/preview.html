<!doctype html>
<html>
<head><meta charset="utf-8"><title>ALFA Interface</title>
<style>
html,body{margin:0;background:var(--ground)}
.c{position:relative;width:960px;height:288px;background:var(--ground);overflow:hidden}
.n{position:absolute;left:var(--space-xxxLarge);bottom:var(--space-xxxLarge);max-width:440px}
.n b{display:block;font:500 72px/.95 var(--font-display);letter-spacing:-1.5px;color:var(--ink)}
.n span{display:block;margin-top:var(--space-medium);font:400 13px/1.4 var(--font-sans);color:var(--ink-3)}
svg{position:absolute;left:0;top:0}
.s50{fill:var(--stein-50)}.s200{fill:var(--stein-200)}.s400{fill:var(--stein-400)}.s700{fill:var(--stein-700)}.s900{fill:var(--stein-900)}.pan{fill:var(--panel)}
.dot{fill:var(--stein-300)}.ring{fill:none;stroke:var(--blob-ink);stroke-width:1}.bl{fill:var(--blob)}
</style></head>
<body>
<div class="c">
<svg width="960" height="288" viewBox="0 0 960 288" aria-hidden="true">
<!-- Blöcke: blob (stein-900 hell, stein-100 dunkel), stein-700, stein-400, stein-200, panel; Maße aus space-xxxLarge (48) und lane-collapsed (56) -->
<!-- Anordnung: drei Bahnen wie die Schale, rechts von x 480, die mittlere breit, links eine gefaltete Bahn; darüber der Blob als Pille -->
<!-- Muster: Punktraster im Schritt space-large (16), weil die Leiter ein 4er-Raster ist und das System leise bleibt -->
<!-- Radien: radius-lane (16) für Bahnen, radius-capsule für den Blob (halbe Höhe) -->
<g class="dot">
<circle cx="648" cy="24" r="1.5"/><circle cx="648" cy="40" r="1.5"/><circle cx="664" cy="24" r="1.5"/><circle cx="664" cy="40" r="1.5"/><circle cx="680" cy="24" r="1.5"/><circle cx="680" cy="40" r="1.5"/><circle cx="696" cy="24" r="1.5"/><circle cx="696" cy="40" r="1.5"/><circle cx="712" cy="24" r="1.5"/><circle cx="712" cy="40" r="1.5"/><circle cx="728" cy="24" r="1.5"/><circle cx="728" cy="40" r="1.5"/><circle cx="744" cy="24" r="1.5"/><circle cx="744" cy="40" r="1.5"/><circle cx="760" cy="24" r="1.5"/><circle cx="760" cy="40" r="1.5"/><circle cx="776" cy="24" r="1.5"/><circle cx="776" cy="40" r="1.5"/><circle cx="792" cy="24" r="1.5"/><circle cx="792" cy="40" r="1.5"/><circle cx="808" cy="24" r="1.5"/><circle cx="808" cy="40" r="1.5"/><circle cx="824" cy="24" r="1.5"/><circle cx="824" cy="40" r="1.5"/><circle cx="840" cy="24" r="1.5"/><circle cx="840" cy="40" r="1.5"/><circle cx="856" cy="24" r="1.5"/><circle cx="856" cy="40" r="1.5"/><circle cx="872" cy="24" r="1.5"/><circle cx="872" cy="40" r="1.5"/><circle cx="888" cy="24" r="1.5"/><circle cx="888" cy="40" r="1.5"/><circle cx="904" cy="24" r="1.5"/><circle cx="904" cy="40" r="1.5"/><circle cx="920" cy="24" r="1.5"/><circle cx="920" cy="40" r="1.5"/><circle cx="936" cy="24" r="1.5"/><circle cx="936" cy="40" r="1.5"/><circle cx="952" cy="24" r="1.5"/><circle cx="952" cy="40" r="1.5"/>
</g>
<rect class="bl" x="504" y="64" width="56" height="200" rx="16"/>
<rect class="pan" x="572" y="64" width="208" height="200" rx="16"/>
<rect class="s200" x="588" y="88" width="176" height="24" rx="8"/>
<rect class="s400" x="588" y="128" width="120" height="12" rx="6"/>
<rect class="s200" x="588" y="152" width="160" height="12" rx="6"/>
<rect class="s200" x="588" y="176" width="144" height="12" rx="6"/>
<rect class="s700" x="792" y="64" width="168" height="200" rx="16"/>
<rect class="bl" x="504" y="12" width="124" height="36" rx="18"/>
<circle class="ring" cx="526" cy="30" r="13"/>
<!-- Stimmungsreihe: fünf mood-Töne im Schritt space-xxLarge (24) -->
<circle cx="504" cy="277" r="8" fill="var(--mood-rose)"/><circle cx="528" cy="277" r="8" fill="var(--mood-apricot)"/><circle cx="552" cy="277" r="8" fill="var(--mood-coral)"/><circle cx="576" cy="277" r="8" fill="var(--mood-umber)"/><circle cx="600" cy="277" r="8" fill="var(--mood-petrol)"/>
</svg>
<div class="n"><b>ALFA<br>Interface</b><span>Drei Bahnen, ein Blob, Weiß als Grund, Haarlinien, eine Stimmung für Ausdruck.</span></div>
</div>
</body>
</html>

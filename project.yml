name: ALFA_OS

options:
  developmentLanguage: de
  deploymentTarget:
    macOS: "26.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    DEVELOPMENT_TEAM: 28Z2KHMANG
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
    MARKETING_VERSION: "0.1.10"
    CURRENT_PROJECT_VERSION: "10"

packages:
  ALFA:
    path: .

targets:
  ALFA_OS:
    type: application
    platform: macOS
    sources:
      - path: App
      - path: Resources/Fonts
        buildPhase: resources
      - path: Resources/Assets.xcassets
        buildPhase: resources
      - path: Resources/Localizable.xcstrings
        buildPhase: resources
      - path: Resources/apps.json
        buildPhase: resources
    dependencies:
      - package: ALFA
        product: Core
      - package: ALFA
        product: Design
      - package: ALFA
        product: Shell
      - package: ALFA
        product: Storage
      - package: ALFA
        product: Calculation
      - package: ALFA
        product: Hub
      - package: ALFA
        product: Assistant
      - package: ALFA
        product: Mail
      - package: ALFA
        product: Google
      - package: ALFA
        product: Airtable
      - package: ALFA
        product: ClickUp
      - package: ALFA
        product: Sevdesk
      - package: ALFA
        product: Clockodo
      - package: ALFA
        product: Shipping
    postBuildScripts:
      - name: Branch
        basedOnDependencyAnalysis: false
        inputFiles:
          - $(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)
        script: |
          plist="$TARGET_BUILD_DIR/$INFOPLIST_PATH"
          branch=$(git -C "$SRCROOT" rev-parse --abbrev-ref HEAD 2>/dev/null) || exit 0
          commit=$(git -C "$SRCROOT" rev-parse --short HEAD 2>/dev/null) || exit 0
          git -C "$SRCROOT" diff --quiet HEAD -- 2>/dev/null || commit="$commit+"
          /usr/libexec/PlistBuddy -c "Delete :ALFABranch" "$plist" >/dev/null 2>&1
          /usr/libexec/PlistBuddy -c "Delete :ALFACommit" "$plist" >/dev/null 2>&1
          /usr/libexec/PlistBuddy -c "Add :ALFABranch string $branch" "$plist"
          /usr/libexec/PlistBuddy -c "Add :ALFACommit string $commit" "$plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.johannesleoberger.alfaos
        PRODUCT_NAME: ALFA_OS
        SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/ALFA_OS.entitlements
        ENABLE_APP_SANDBOX: YES
        ENABLE_OUTGOING_NETWORK_CONNECTIONS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
